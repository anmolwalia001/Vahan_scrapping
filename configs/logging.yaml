version: 1
disable_existing_loggers: False

formatters:
  standard:
    format: "[%(asctime)s] [%(levelname)s] [%(name)s] - %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: INFO
    formatter: standard
    filename: logs/app.log   # relative to BASE_DIR
    encoding: utf-8

loggers:
  app:   # your main app logger
    level: DEBUG
    handlers: [console, file]
    propagate: no

root:    # fallback logger
  level: INFO
  handlers: [console, file]
